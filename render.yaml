# SubscriptIQ — Render Infrastructure-as-Code Blueprint
# Automatically provisions PostgreSQL, Node.js/Express Backend, and React Frontend in 1 Click

services:
  # 1. Backend Express REST API
  - type: web
    name: subscriptiq-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma db push && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: subscriptiq-db
          property: connectionString

  # 2. Frontend React / Vite Static Web Application
  - type: web
    name: subscriptiq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: subscriptiq-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: subscriptiq-db
    databaseName: subscriptiq
    user: subscriptiq
    plan: free
    region: oregon
